; Setelan OPcache untuk container produksi.
; OPcache sudah aktif sejak image dasar; di sini hanya ukurannya dinaikkan
; karena proyek Laravel punya ribuan berkas.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Karena kode PHP hanya berubah saat image dibangun ulang, pemeriksaan waktu
; ubah berkas dimatikan supaya tidak ada stat() di setiap permintaan.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
