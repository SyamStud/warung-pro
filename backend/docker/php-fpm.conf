; Pool php-fpm untuk Warung POS.
;
; Berkas di php-fpm.d/ disisipkan di akhir php-fpm.conf, jadi nama "zz-" membuat
; setelan di bawah menang atas bawaan image.

[global]
error_log = /dev/stderr
daemonize = no

[www]
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

; Variabel lingkungan container harus sampai ke aplikasi (mis. TRUSTED_PROXIES,
; DB_PASSWORD). php-fpm membuangnya kalau baris ini tidak ada.
clear_env = no

; Server ini dipakai bersama container lain (immich, minio, …) dengan RAM
; terbatas, jadi jumlah pekerja sengaja kecil.
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 8M
