; Supervisor di dalam container: menjaga php-fpm dan nginx tetap hidup dan
; meneruskan log keduanya ke stdout/stderr container, sehingga `docker compose
; logs` memperlihatkan semuanya dalam satu aliran.
;
; Berkas ini MENGGANTIKAN bawaan paket Alpine (/etc/supervisord.conf, yang
; menyertakan /etc/supervisor.d/*.ini), jadi CMD image memanggilnya langsung:
;   supervisord -c /etc/supervisord.conf -n

[supervisord]
nodaemon = true
user = root
pidfile = /tmp/supervisord.pid
logfile = /dev/null
logfile_maxbytes = 0

[program:php-fpm]
command = php-fpm --nodaemonize
priority = 5
autostart = true
autorestart = true
startsecs = 1
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;"
priority = 10
autostart = true
autorestart = true
startsecs = 1
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
