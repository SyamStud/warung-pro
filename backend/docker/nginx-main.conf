# Konfigurasi utama nginx untuk container Warung POS.
#
# Menimpa bawaan image Alpine supaya berkas pid & direktori sementara berada di
# /tmp: /run dibuat ulang setiap container dijalankan, jadi direktori kosong
# yang disiapkan saat build akan hilang.

user  nginx;
worker_processes  auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log ke stdout supaya terbaca lewat `docker compose logs`.
    access_log /dev/stdout;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip              on;
    gzip_types        application/json;
    gzip_min_length   1024;

    include /etc/nginx/http.d/*.conf;
}
