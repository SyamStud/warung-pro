# Warung POS — API Laravel + PostgreSQL.
#
#   cd backend && docker compose up -d --build
#
# Rahasia (APP_KEY, sandi database) dibaca dari `.env` di direktori ini. Berkas
# itu tidak ikut ke git; scripts/deploy-server.sh membuatnya sekali di server
# dan tidak pernah menimpanya lagi.
#
# Nilai di blok `environment:` menang atas isi .env, supaya cara container ini
# dijalankan tidak bergantung pada .env lokal yang kebetulan ikut tersalin.

name: warung

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-warung}
      POSTGRES_USER: ${DB_USERNAME:-warung}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD belum diisi di .env}
    # Server ini dipakai bersama container lain, jadi koneksi dibatasi.
    command: ["postgres", "-c", "max_connections=40"]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U ${DB_USERNAME:-warung} -d ${DB_DATABASE:-warung}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    build:
      context: .
    image: warung-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: warning
      TZ: Asia/Jakarta

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"

      # Permintaan selalu datang lewat tunnel (Cloudflare/Tailscale) yang
      # mengakhiri TLS, jadi proxy-nya dipercaya.
      TRUSTED_PROXIES: "*"
    ports:
      - "7001:80"
    volumes:
      # APK rilis + log + sesi: harus bertahan saat image dibangun ulang.
      - app-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Connector Cloudflare Tunnel — alternatif selain tunnel yang sudah jalan di
  # server ini. Hanya ikut dijalankan kalau TUNNEL_TOKEN ada di .env dan
  # profilnya diaktifkan (scripts/deploy-server.sh mengurus keduanya):
  #   docker compose --profile tunnel up -d
  #
  # Rute publiknya (mis. pos.syamlab.my.id → http://app:80) diatur di dashboard
  # Cloudflare Zero Trust, bukan di berkas ini.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?TUNNEL_TOKEN belum diisi di .env}
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  db-data:
  app-storage:
